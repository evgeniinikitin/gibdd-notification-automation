[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "buscript-api"
version = "0.1.0"
description = "FastAPI backend and browser workers for Buscript"
requires-python = ">=3.12"
dependencies = [
  "aiofiles>=24.1,<25",
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<24",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.4,<6",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx[socks]>=0.28,<1",
  "jsonschema>=4.23,<5",
  "lxml>=5.3,<6",
  "openpyxl>=3.1,<4",
  "pillow>=11,<12",
  "playwright>=1.49,<2",
  "pydantic-settings>=2.7,<3",
  "pydantic>=2.10,<3",
  "pyjwt>=2.10,<3",
  "pypdf>=5.1,<6",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "redis>=5.2,<6",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["app"]
